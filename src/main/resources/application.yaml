# Default configuration for local development
spring:
  datasource:
    # Force sử dụng local PostgreSQL, không cho phép override
    url: jdbc:postgresql://localhost:5432/quanlysieuthi
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    
    # Connection Pool Configuration - HikariCP (PostgreSQL optimized)
    hikari:
      maximum-pool-size: 10         # Local PostgreSQL có thể dùng nhiều kết nối hơn
      minimum-idle: 5               # Giữ 5 kết nối idle
      connection-timeout: 30000     # 30 giây
      idle-timeout: 600000          # 10 phút
      max-lifetime: 1800000         # 30 phút
      leak-detection-threshold: 60000 # 1 phút
      connection-test-query: SELECT 1
      validation-timeout: 5000      # 5 giây
      
      # Cấu hình để đóng kết nối nhanh hơn
      auto-commit: true
      read-only: false
      transaction-isolation: TRANSACTION_READ_COMMITTED
      
      # PostgreSQL specific settings
      data-source-properties:
        # Disable prepared statement cache for PostgreSQL compatibility
        cachePrepStmts: false
        prepStmtCacheSize: 0
        prepStmtCacheSqlLimit: 0
        useServerPrepStmts: false
        
        # Connection settings
        reWriteBatchedInserts: false
        socketTimeout: 30000
        connectTimeout: 30000
        
        # Force disable prepared statements
        prepareThreshold: 0
        
        # Disable statement caching
        statementCacheSize: 0
        
        # Force simple queries
        simpleQuery: true
        
        # Additional PostgreSQL settings
        tcpKeepAlive: true
        defaultRowPrefetch: 100      # Tối ưu cho local
        unknownLength: 2147483647
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none  # Thay đổi từ 'none' thành 'update' để tự động tạo cột mới
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
        format_sql: true
        # Minimal Hibernate configuration for PostgreSQL compatibility
        jdbc:
          batch_size: 0
          use_get_generated_keys: false
        connection:
          provider_disables_autocommit: false
        cache:
          use_second_level_cache: false
          use_query_cache: false
        # Disable prepared statements completely
        generate_statistics: false
        # Force simple SQL generation
        globally_quoted_identifiers: false
        globally_quoted_identifiers_skip_column_definitions: true
        # Disable all optimizations
        order_inserts: false
        order_updates: false
        batch_fetch_style: DYNAMIC
        # Force simple metadata extraction
        metadata_builder: none
        # Force simple queries
        query:
          fail_on_pagination_over_collection_fetch: false
  security:
    # Bật lại Spring Security
    enabled: true
    user:
      # Tắt user mặc định của Spring Security
      name: 
      password: 
      roles: 
    # Cấu hình cho BCrypt password encoder
    password:
      encoder:
        strength: 12  # Độ mạnh của BCrypt (từ 4-31, mặc định là 10)
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:test}
            client-secret: ${GOOGLE_CLIENT_SECRET:test}
            scope:
              - email
              - profile
            redirect-uri: "http://localhost:8080/login/oauth2/code/google"
            authorization-grant-type: authorization_code
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID:test}
            client-secret: ${FACEBOOK_CLIENT_SECRET:test}
            scope:
              - email
              - public_profile
            redirect-uri: "http://localhost:8080/login/oauth2/code/facebook"
            authorization-grant-type: authorization_code
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth?prompt=consent
            token-uri: https://www.googleapis.com/oauth2/v3/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            # Tắt ID token validation
            jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
            user-name-attribute: sub
          facebook:
            authorization-uri: https://www.facebook.com/dialog/oauth
            token-uri: https://graph.facebook.com/oauth/access_token
            user-info-uri: https://graph.facebook.com/me?fields=id,first_name,middle_name,last_name,name,email,verified
            user-name-attribute: id

  # Cho phép circular references tạm thời
  main:
    allow-circular-references: true
  # Tắt auto-configuration cho UserDetailsService
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  
  # File Upload Configuration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      enabled: true
  
  # Static Resources Configuration - Serve ảnh từ thư mục uploads
  web:
    resources:
      static-locations: 
        - classpath:/static/
        - file:./uploads/
        - file:./static/
  
  # Gmail SMTP Configuration
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:test}
    password: ${GMAIL_PASSWORD:test}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000
        transport:
          protocol: smtp

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
    try-it-out-enabled: true
    doc-expansion: none
    default-models-expand-depth: 1
    default-model-rendering: model
  show-actuator: false
  group-configs:
    - group: "Mini Supermarket API"
      paths-to-match:
        - "/api/**"
        - "/rest/**"
      packages-to-scan:
        - "com.example.mini_supermarket.rest.controller"

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:lj4rZPDvdCsTGInKfrNgFbKPq6xSg5svMzrKfDsTSpATgFuOM268cvRCRzWw2WLc}
  expiration: ${JWT_EXPIRATION:86400}  # 24 hours in seconds

# OAuth2 Frontend Integration - Redirect to Frontend after OAuth2
oauth2:

# File Upload Configuration
app:
  images:
    upload-dir: ./uploads/images
    static-dir: ./static/images
    allowed-extensions: jpg,jpeg,png,gif,webp,jfif
    max-size: 10485760  # 10MB in bytes
  frontend:
    base-url: ${FRONTEND_URL:http://localhost:3000}
    success-path: ${OAUTH2_SUCCESS_PATH:/oauth2/success}
    failure-path: ${OAUTH2_FAILURE_PATH:/login?error=oauth2_failed}
  otp:
    expiration-minutes: ${OTP_EXPIRATION_MINUTES:5}
    max-attempts: ${OTP_MAX_ATTEMPTS:3}


